[package]
name = "qubit-websocket"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
authors = ["Haixing Hu <starfish.hu@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/qubit-ltd/rs-websocket"
description = "Bounded WebSocket client infrastructure for Rust services"
homepage = "https://qubit-ltd.github.io/rs-websocket/"
documentation = "https://docs.rs/qubit-websocket"
readme = "README.md"
keywords = ["websocket", "client", "async", "network", "qubit"]
categories = ["network-programming", "asynchronous"]
include = [
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
    "/README.zh_CN.md",
    "/src/**",
    "/doc/**",
    "/examples/**",
]

[lib]
name = "qubit_websocket"
doctest = true

[workspace]
resolver = "3"

[features]
default = []
config = ["dep:qubit-config"]

[dependencies]
bytes = "^1.11"
futures-util = { version = "^0.3", features = ["sink"] }
http = "^1.5"
rustls = "0.23"
tokio = { version = "^1.53", features = ["net", "rt-multi-thread", "sync", "time", "macros"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7", features = ["rt"] }
webpki-roots = "1"
qubit-config = { version = "0.14", optional = true }

[dev-dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws"] }
qubit-web = { git = "https://github.com/qubit-ltd/rs-web", rev = "3046fa0fbc46c6c4584fdf9710b45649dfebd70a", default-features = false, features = ["ws"] }
rcgen = "0.13"
tokio-rustls = "0.26"
