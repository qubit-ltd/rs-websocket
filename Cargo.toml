[package]
name = "qubit-websocket"
version = "0.3.0"
edition = "2024"
rust-version = "1.94"
authors = ["Haixing Hu <starfish.hu@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/qubit-ltd/rs-websocket"
description = "Bounded WebSocket client infrastructure for Rust services"
homepage = "https://qubit-ltd.github.io/rs-websocket/"
documentation = "https://docs.rs/qubit-websocket"
readme = "README.md"
keywords = ["websocket", "client", "async", "network", "qubit"]
categories = ["network-programming", "asynchronous"]
include = [
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
    "/README.zh_CN.md",
    "/src/**",
    "/doc/user_guide.md",
    "/doc/user_guide.zh_CN.md",
    "/doc/architecture.md",
    "/doc/architecture.zh_CN.md",
    "/doc/design.zh_CN.md",
    "/doc/prd.zh_CN.md",
    "/examples/**",
]

[package.metadata.docs.rs]
all-features = true

[lib]
name = "qubit_websocket"
doctest = true

[workspace]
resolver = "3"

[features]
default = []
config = ["dep:qubit-config"]

[dependencies]
bytes = "^1.11"
futures-util = { version = "^0.3", features = ["sink"] }
http = "^1.5"
rustls = "^0.23"
tokio = { version = "^1.54", features = ["net", "rt-multi-thread", "sync", "time", "macros"] }
tokio-tungstenite = { version = "^0.30", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
webpki-roots = "^1.0"
qubit-config = { path = "../rs-config", version = "^0.15", default-features = false, optional = true }

[patch.crates-io]
tungstenite = { git = "https://github.com/qubit-ltd/tungstenite-rs", rev = "b24a4442be0247a71fe9ee4e520eb483ac1b2873" }

[dev-dependencies]
axum = { version = "^0.8", default-features = false, features = ["http1", "tokio", "ws"] }
qubit-web = { default-features = false, features = ["ws"] , version = "^0.3", path = "../rs-web" }
rcgen = "^0.13"
tokio-rustls = "^0.26"
rustls = { version = "^0.23", features = ["ring"] }
